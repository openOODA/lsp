name: lsp CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v0.6.16)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - name: checkout lsp
        uses: actions/checkout@v4
        with:
          path: lsp
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: gcc
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || { echo "missing oodac/bin/oodac"; exit 1; }
          test -x oodac/bin/oodac_bin.core || { echo "missing oodac/bin/oodac_bin.core"; exit 1; }
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: emit-c gcc run probes
        working-directory: ${{ github.workspace }}
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_EMIT_CONCAT: 1
        run: |
          set -euo pipefail
          mkdir -p "$OODA_FS_WRITEDIR"
          probes="probe_initialize probe_completion probe_hover probe_definition probe_diagnostics probe_formatting probe_codeaction probe_double_run probe_token probe_uri probe_bridge probe_session probe_document_link probe_inlay probe_document_symbol probe_execute_command probe_json_smuggle probe_utf16 probe_struct_merge probe_docs probe_check probe_sync probe_sync_escape probe_nav probe_semantic probe_resolve probe_em_cache probe_path probe_check_json probe_ws_scan probe_refs_ws probe_fix probe_unescape"
          rt="$OODA_FS_READDIR/oodac/runtime"
          bb="$OODA_FS_READDIR/oodar/core/blackbox/blackbox.c"
          echo "  PRECOMPILE oodar runtime"
          gcc -O0 -c "$OODA_FS_READDIR/oodar/oodar.c" -o "$OODA_FS_WRITEDIR/oodar.o" -I "$OODA_FS_READDIR/oodar"
          failed=0
          for name in $probes; do
            rel="lsp/qa/${name}.oo"
            cfile="$OODA_FS_WRITEDIR/${name}.c"
            binp="$OODA_FS_WRITEDIR/${name}"
            echo "  CHECK $rel"
            if ! "$OODA_COMPILER" check "$rel"; then
              echo "  FAIL check $name"
              failed=$((failed + 1))
              continue
            fi
            echo "  EMIT $rel"
            if ! "$OODA_COMPILER" emit-c "$rel" > "$cfile"; then
              echo "  FAIL emit $name"
              failed=$((failed + 1))
              continue
            fi
            if ! gcc -O0 -o "$binp" "$cfile" "$OODA_FS_WRITEDIR/oodar.o" -lm; then
              echo "  FAIL gcc $name"
              failed=$((failed + 1))
              continue
            fi
            if ! "$binp"; then
              echo "  FAIL run $name"
              failed=$((failed + 1))
              continue
            fi
            echo "  PASS $name"
          done
          echo "Results: failed=$failed"
          test "$failed" -eq 0

  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout lsp
        uses: actions/checkout@v4
        with:
          path: lsp
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: build native binary
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          mkdir -p dist
          "${OODA_COMPILER}" build --backend c lsp/cli/main.oo -o dist/ooda-lsp-linux-x86_64
          chmod +x dist/ooda-lsp-linux-x86_64
          (cd dist && sha256sum ooda-lsp-linux-x86_64 > ooda-lsp-linux-x86_64.sha256)
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  blackbox-gate:
    needs: [probes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout lsp
        uses: actions/checkout@v4
        with:
          path: lsp
      - name: install openOODA toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://openooda.org/install.sh | bash
          echo "$HOME/.openooda/bin" >> "$GITHUB_PATH"
      - name: blackbox double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/lsp
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in qa/*.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            ~/.openooda/bin/blackbox trace "$f" > "/tmp/${base}.trace1" 2>&1 || {
              echo "[blackbox-gate FAIL] trace non-zero exit on $f"
              exit 1
            }
            ~/.openooda/bin/blackbox trace "$f" > "/tmp/${base}.trace2" 2>&1 || {
              echo "[blackbox-gate FAIL] second trace non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.trace1" "/tmp/${base}.trace2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic trace on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.trace1" "/tmp/${base}.trace2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/*.oo in this repo"
            exit 0
          fi
          echo "[blackbox-gate OK] $count probes deterministic across double-run"

  auto-release:
    needs: [probes, build, blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@main
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
