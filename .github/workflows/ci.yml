name: lsp CI

on:
  push:
    branches: [main]

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - name: checkout lsp
        uses: actions/checkout@v4
        with:
          path: lsp
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: gcc
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || { echo "missing oodac/bin/oodac"; exit 1; }
          test -x oodac/bin/oodac_bin.core || { echo "missing oodac/bin/oodac_bin.core"; exit 1; }
          test -f oodac/runtime/chs_rt.c || { echo "missing oodac/runtime/chs_rt.c"; exit 1; }
      - name: emit-c gcc run probes
        working-directory: ${{ github.workspace }}
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ runner.temp }}/lsp-probes
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          mkdir -p "$OODA_FS_WRITEDIR"
          probes="probe_initialize probe_completion probe_hover probe_definition probe_diagnostics probe_formatting probe_codeaction probe_double_run probe_token probe_uri probe_bridge probe_session probe_document_link probe_inlay probe_document_symbol probe_execute_command probe_json_smuggle probe_utf16 probe_struct_merge probe_docs probe_check probe_sync probe_nav probe_semantic probe_resolve"
          rt="$OODA_FS_READDIR/oodac/runtime"
          failed=0
          for name in $probes; do
            rel="lsp/qa/${name}.oo"
            cfile="$OODA_FS_WRITEDIR/${name}.c"
            binp="$OODA_FS_WRITEDIR/${name}"
            echo "  EMIT $rel"
            if ! "$OODA_COMPILER" emit-c "$rel" > "$cfile"; then
              echo "  FAIL emit $name"
              failed=$((failed + 1))
              continue
            fi
            if ! gcc -O0 -o "$binp" "$cfile" "$rt/chs_rt.c" -I "$rt" -lm; then
              echo "  FAIL gcc $name"
              failed=$((failed + 1))
              continue
            fi
            if ! "$binp"; then
              echo "  FAIL run $name"
              failed=$((failed + 1))
              continue
            fi
            echo "  PASS $name"
          done
          echo "Results: failed=$failed"
          test "$failed" -eq 0

  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout lsp
        uses: actions/checkout@v4
        with:
          path: lsp
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodac/runtime/chs_rt.c || { echo "missing oodac/runtime/chs_rt.c"; exit 1; }
      - name: build native binary
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          mkdir -p dist
          "${OODA_COMPILER}" build lsp/cli/main.oo -o dist/ooda-lsp-linux-x86_64
          chmod +x dist/ooda-lsp-linux-x86_64
          (cd dist && sha256sum ooda-lsp-linux-x86_64 > ooda-lsp-linux-x86_64.sha256)
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  auto-release:
    needs: [probes, build]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@main
    with:
      artifact_pattern: 'release-assets-*'
