name: lsp CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v0.6.16)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  probes:
    runs-on: ubuntu-latest
    env:
      OO_LIST_AMBIENT_QUOTA: "8589934592"
    steps:
      - name: checkout lsp
        uses: actions/checkout@v4
        with:
          path: lsp
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || { echo "missing oodac/bin/oodac"; exit 1; }
          test -x oodac/bin/oodac_bin.core || { echo "missing oodac/bin/oodac_bin.core"; exit 1; }
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: oodac build run probes
        working-directory: ${{ github.workspace }}
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          mkdir -p "$OODA_FS_WRITEDIR"
          probes="probe_initialize probe_completion probe_hover probe_definition probe_diagnostics probe_formatting probe_codeaction probe_double_run probe_token probe_uri probe_bridge probe_session probe_document_link probe_inlay probe_document_symbol probe_execute_command probe_json_smuggle probe_utf16 probe_struct_merge probe_docs probe_check probe_sync probe_sync_escape probe_nav probe_semantic probe_resolve probe_em_cache probe_path probe_check_json probe_ws_scan probe_refs_ws probe_fix probe_unescape probe_edge_wire"
          failed=0
          for name in $probes; do
            rel="lsp/qa/${name}.oo"
            binp="$OODA_FS_WRITEDIR/${name}"
            echo "  BUILD $rel"
            if ! "$OODA_COMPILER" build "$rel" -o "$binp"; then
              echo "  FAIL build $name"
              failed=$((failed + 1))
              continue
            fi
            if ! "$binp"; then
              echo "  FAIL run $name"
              failed=$((failed + 1))
              continue
            fi
            echo "  PASS $name"
          done
          echo "Results: failed=$failed"
          test "$failed" -eq 0

  build:
    runs-on: ubuntu-latest
    env:
      OO_LIST_AMBIENT_QUOTA: "8589934592"
    steps:
      - name: checkout lsp
        uses: actions/checkout@v4
        with:
          path: lsp
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: build native binary
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          mkdir -p dist
          "${OODA_COMPILER}" build lsp/cli/main.oo -o dist/ooda-lsp-linux-x86_64
          chmod +x dist/ooda-lsp-linux-x86_64
          (cd dist && sha256sum ooda-lsp-linux-x86_64 > ooda-lsp-linux-x86_64.sha256)
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  blackbox-gate:
    needs: [probes]
    if: always()
    runs-on: ubuntu-latest
    env:
      OO_LIST_AMBIENT_QUOTA: "8589934592"
    steps:
      - name: checkout lsp
        uses: actions/checkout@v4
        with:
          path: lsp
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: determinism double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/lsp
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/*.diff[12]' EXIT
          shopt -s nullglob
          count=0
          for f in qa/probe_*.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff1" 2>&1 || {
              echo "[blackbox-gate FAIL] diff non-zero exit on $f"
              exit 1
            }
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff2" 2>&1 || {
              echo "[blackbox-gate FAIL] second diff non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.diff1" "/tmp/${base}.diff2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic diff on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.diff1" "/tmp/${base}.diff2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/probe_*.oo in this repo"
            exit 0
          fi
          echo "[blackbox-gate OK] $count probes deterministic across double-run (oodac-native gate)"

  auto-release:
    needs: [probes, build, blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
